id: ransomware_canary_tripped
name: Canary file modification or deletion (ransomware tripwire)
kind: sigma
severity: critical
enabled: true
tactics:
- Impact
techniques:
- T1486
data_sources:
- fim
- edr
condition:
  event_type: canary_touch
  count_threshold: 1
  time_window_seconds: 60
  group_by: hostname
  filter:
    path_contains:
    - .canary
    - canary.txt
    - canary_ransom
    - .canary_tripwire
entityMappings:
- type: Host
  field: hostname
- type: File
  field: file_path
description: Detects modification, deletion, or renaming of a designated decoy canary file deployed to detect ransomware traversals.
references:
- https://attack.mitre.org/techniques/T1486/
