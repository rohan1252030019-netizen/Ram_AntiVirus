name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_call:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ------------------------------------------------------------------
  # Secrets Leak Detection
  # ------------------------------------------------------------------
  secrets-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Check for committed secrets and key patterns
        run: |
          echo "Scanning for forbidden secret patterns..."
          ERRORS=0
          if git grep -EI "c6_vOo[A-Za-z0-9_-]{37}" -- ':!.github/workflows/ci.yml' ':!*.log'; then
            echo "ERROR: Found compromised legacy master API key in tracked files!"
            ERRORS=1
          fi

          if git grep -EI "-----BEGIN (RSA|EC|DSA|OPENSSH) PRIVATE KEY-----" -- ':!*.log'; then
            echo "ERROR: Found plaintext private key header in tracked files!"
            ERRORS=1
          fi

          if git grep -EI "hooks\.slack\.com/services/T[0-9A-Z]{8}/B[0-9A-Z]{8}/[0-9A-Za-z]{24}" -- ':!*.log'; then
            echo "ERROR: Found live webhook URL in tracked files!"
            ERRORS=1
          fi

          if [ $ERRORS -ne 0 ]; then
            echo "Secrets scan failed! Please remove secrets from tracked files."
            exit 1
          fi
          echo "Secrets scan passed cleanly."

  # ------------------------------------------------------------------
  # Branding Verification (AEGIS -> Ram Antivirus)
  # ------------------------------------------------------------------
  branding-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Verify Ram Antivirus branding compliance
        run: python scripts/verify_ram_rename.py

  # ------------------------------------------------------------------
  # Lint backend (ruff) - strict exit codes
  # ------------------------------------------------------------------
  lint-backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install ruff
        run: pip install ruff

      - name: Lint
        run: |
          cd backend
          ruff check app/

  # ------------------------------------------------------------------
  # Backend unit tests (pytest)
  # ------------------------------------------------------------------
  test-backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: |
          cd backend
          pip install -r requirements.txt

      - name: Run unit tests
        run: |
          cd backend
          python -m pytest tests/unit tests/integration -q

  # ------------------------------------------------------------------
  # Agent Rust unit & emulation tests
  # ------------------------------------------------------------------
  test-agent-rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable

      - name: Run agent-rust tests
        run: |
          cd agent-rust
          cargo test --verbose

  # Note: desktop-tauri and node-tauri require native Linux GUI libraries
  # (WebKitGTK 4.1, libsoup-3.0, libappindicator3-dev) which are omitted on
  # headless Ubuntu runners to avoid 15+ minute build timeouts. They are
  # verified in desktop release packaging pipelines.

  # ------------------------------------------------------------------
  # Windows ETW Telemetry Test (Task B1)
  # ------------------------------------------------------------------
  test-windows-etw:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable

      - name: Run ETW canary PID correlation test
        run: |
          cd node-tauri/src-tauri
          cargo test --test test_etw_canary --features ferrisetw -- --nocapture

  # ------------------------------------------------------------------
  # Agent Python unit tests
  # ------------------------------------------------------------------
  test-agent-python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          cd agent
          pip install -r requirements.txt pytest

      - name: Run agent tests
        run: |
          cd agent
          python -m pytest test_windows_isolation.py test_persistence_monitor.py -v

  # ------------------------------------------------------------------
  # Frontend build
  # ------------------------------------------------------------------
  build-frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: "20"

      - name: Install dependencies
        run: |
          cd frontend
          npm install

      - name: Build
        run: |
          cd frontend
          npm run build

  # ------------------------------------------------------------------
  # Docker compose validation
  # ------------------------------------------------------------------
  build-docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Verify compose config
        run: docker compose config --quiet
